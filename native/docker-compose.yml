x-database-environment: &database-environment
  LIGHTNING_APP_ENV: prod
  LIGHTNING_DATABASE_DSN: "host=postgres user=postgres password=${LIGHTNING_POSTGRES_PASSWORD:-post123} dbname=lightning port=5432 sslmode=disable TimeZone=Asia/Shanghai"

x-registry-environment: &registry-environment
  LIGHTNING_REGISTRY_DRIVER: consul
  LIGHTNING_REGISTRY_ADDRESS: http://consul:8500

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { TARGET: gateway }
    ports: ["9009:9009"]
    environment:
      <<: *registry-environment
      LIGHTNING_APP_ENV: prod
      LIGHTNING_SERVER_PORT: 9009
    depends_on:
      iam: { condition: service_healthy }
      sys: { condition: service_healthy }
      resource: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9009/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  iam:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { TARGET: iam }
    environment:
      <<: [*database-environment, *registry-environment]
      LIGHTNING_SERVER_PORT: 9010
      LIGHTNING_GRPC_PORT: 9110
      LIGHTNING_SERVICE_ADVERTISE_HOST: iam
      LIGHTNING_REDIS_ADDR: redis:6379
      LIGHTNING_REDIS_PASSWORD: "${LIGHTNING_REDIS_PASSWORD:-123456}"
      LIGHTNING_JWT_SECRET: "${LIGHTNING_JWT_SECRET:?set LIGHTNING_JWT_SECRET}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9010/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  sys:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { TARGET: sys }
    environment:
      <<: [*database-environment, *registry-environment]
      LIGHTNING_SERVER_PORT: 9011
      LIGHTNING_GRPC_PORT: 9111
      LIGHTNING_SERVICE_ADVERTISE_HOST: sys
      LIGHTNING_REDIS_ADDR: redis:6379
      LIGHTNING_REDIS_PASSWORD: "${LIGHTNING_REDIS_PASSWORD:-123456}"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9011/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  resource:
    build:
      context: .
      dockerfile: Dockerfile.service
      args: { TARGET: resource }
    environment:
      <<: [*database-environment, *registry-environment]
      LIGHTNING_SERVER_PORT: 9012
      LIGHTNING_GRPC_PORT: 9112
      LIGHTNING_SERVICE_ADVERTISE_HOST: resource
      LIGHTNING_STORAGE_ENDPOINT: rustfs:9000
      LIGHTNING_STORAGE_ACCESS_KEY: "${LIGHTNING_RUSTFS_ACCESS_KEY:-rustfsadmin}"
      LIGHTNING_STORAGE_SECRET_KEY: "${LIGHTNING_RUSTFS_SECRET_KEY:-rustfsadmin}"
      LIGHTNING_STORAGE_REGION: us-east-1
      LIGHTNING_STORAGE_BUCKET: "${LIGHTNING_RUSTFS_BUCKET:-lightning}"
      LIGHTNING_STORAGE_USE_SSL: "false"
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_healthy }
      consul: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:9012/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    environment:
      <<: [*database-environment, *registry-environment]
    depends_on:
      sys: { condition: service_healthy }
      resource: { condition: service_healthy }
    restart: unless-stopped

  consul:
    image: hashicorp/consul:1.21
    command: ["agent", "-dev", "-client=0.0.0.0"]
    ports: ["8500:8500"]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LIGHTNING_POSTGRES_PASSWORD:-post123}"
      POSTGRES_DB: lightning
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lightning"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${LIGHTNING_REDIS_PASSWORD:-123456}"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${LIGHTNING_REDIS_PASSWORD:-123456}' ping >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.10
    ports: ["9000:9000", "9001:9001"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${LIGHTNING_RUSTFS_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${LIGHTNING_RUSTFS_SECRET_KEY:-rustfsadmin}"
    volumes: ["rustfs-data:/data"]
    depends_on:
      rustfs-volume-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  rustfs-volume-init:
    image: alpine:3.22
    user: "0:0"
    volumes: ["rustfs-data:/data"]
    command: ["sh", "-c", "chown -R 10001:10001 /data"]

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
