syntax = "proto3";

package lightning.sys.v1;

option go_package = "github.com/gcc798/lightning/internal/api/sys/v1;sysv1";

service SystemService {
  rpc RecordLogin(RecordLoginRequest) returns (Empty);
  rpc RecordOperations(RecordOperationsRequest) returns (Empty);
  rpc CleanLogs(CleanLogsRequest) returns (CleanLogsResponse);
}

message Empty {}

message RecordLoginRequest {
  int64 id = 1;
  string user_name = 2;
  string ip_address = 3;
  string browser = 4;
  string os = 5;
  int32 status = 6;
  string message = 7;
  int64 login_time_unix_milli = 8;
  string client_id = 9;
}

message OperationLog {
  int64 id = 1;
  string title = 2;
  string business_type = 3;
  string method = 4;
  string request_method = 5;
  string device_type = 6;
  string operator_name = 7;
  string url = 8;
  string ip_address = 9;
  string parameters = 10;
  string status = 11;
  string error_message = 12;
  int64 operation_time_unix_milli = 13;
  int64 cost_millis = 14;
  string user_agent = 15;
}

message RecordOperationsRequest {
  repeated OperationLog logs = 1;
}

message CleanLogsRequest {
  int32 days = 1;
}

message CleanLogsResponse {
  int64 login_logs = 1;
  int64 operation_logs = 2;
}
