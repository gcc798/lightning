apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microservice-kit-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.yourdomain.com
    secretName: microservice-kit-tls
  rules:
  - host: api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: microservice-kit-gateway
            port:
              number: 80
