apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lightning-consul
spec:
  serviceName: lightning-consul
  replicas: 1
  selector:
    matchLabels: { app: lightning-consul }
  template:
    metadata:
      labels: { app: lightning-consul }
    spec:
      containers:
        - name: consul
          image: hashicorp/consul:1.21
          args: ["agent", "-server", "-bootstrap-expect=1", "-client=0.0.0.0", "-data-dir=/consul/data"]
          ports:
            - { name: http, containerPort: 8500 }
            - { name: server, containerPort: 8300 }
            - { name: serf-lan, containerPort: 8301 }
          readinessProbe:
            exec:
              command: ["consul", "members"]
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /consul/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
