apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightning-gateway
spec:
  replicas: 2
  selector:
    matchLabels: { app: lightning-gateway }
  template:
    metadata:
      labels: { app: lightning-gateway }
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: gateway
          image: ghcr.io/your-org/lightning-gateway:0.1.0
          ports:
            - { name: http, containerPort: 9009 }
          env:
            - { name: LIGHTNING_APP_ENV, value: prod }
            - { name: LIGHTNING_SERVER_PORT, value: "9009" }
            - { name: LIGHTNING_REGISTRY_DRIVER, value: consul }
            - name: LIGHTNING_REGISTRY_ADDRESS
              valueFrom:
                configMapKeyRef: { name: lightning-config, key: registry-address }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightning-iam
spec:
  replicas: 1
  selector:
    matchLabels: { app: lightning-iam }
  template:
    metadata:
      labels: { app: lightning-iam }
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: iam
          image: ghcr.io/your-org/lightning-iam:0.1.0
          ports:
            - { name: http, containerPort: 9010 }
            - { name: grpc, containerPort: 9110 }
          env:
            - { name: LIGHTNING_APP_ENV, value: prod }
            - { name: LIGHTNING_SERVER_PORT, value: "9010" }
            - { name: LIGHTNING_GRPC_PORT, value: "9110" }
            - name: LIGHTNING_SERVICE_ADVERTISE_HOST
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - { name: LIGHTNING_REGISTRY_DRIVER, value: consul }
            - name: LIGHTNING_REGISTRY_ADDRESS
              valueFrom:
                configMapKeyRef: { name: lightning-config, key: registry-address }
            - name: LIGHTNING_DATABASE_DSN
              valueFrom:
                secretKeyRef: { name: lightning-secret, key: database-dsn }
            - name: LIGHTNING_REDIS_ADDR
              valueFrom:
                configMapKeyRef: { name: lightning-config, key: redis-addr }
            - name: LIGHTNING_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: lightning-secret, key: redis-password }
            - name: LIGHTNING_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: lightning-secret, key: jwt-secret }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe: &service-startup
            httpGet: { path: /health/startup, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe: &service-live
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe: &service-ready
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
