paths:
  /api/v1/attachment/{attachmentId}:
    delete:
      consumes:
      - application/json
      description: 删除指定附件
      parameters:
      - description: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: 附件ID
        in: path
        name: attachmentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gcc798_microservice-kit_internal_httpresponse.Response'
      summary: 删除附件
      tags:
      - 附件管理
    get:
      consumes:
      - application/json
      description: 根据附件ID获取附件详情
      parameters:
      - description: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: 附件ID
        in: path
        name: attachmentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
