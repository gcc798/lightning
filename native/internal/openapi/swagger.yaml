        in: header
        name: Authorization
        required: true
        type: string
      - description: 附件ID
        in: path
        name: attachmentId
        required: true
        type: integer
      - description: 业务信息
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/request.BindAttachmentToBusinessRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_gcc798_microservice-kit_internal_httpresponse.Response'
      summary: 绑定附件到业务
