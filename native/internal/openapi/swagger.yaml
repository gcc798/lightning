        in: header
        name: Authorization
        required: true
        type: string
      - description: 附件ID
        in: path
        name: attachmentId
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: 下载附件
      tags:
      - 附件管理
  /api/v1/attachment/{attachmentId}/url:
    get:
      consumes:
      - application/json
      description: 获取附件的访问URL（支持临时URL）
      parameters:
      - description: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: 附件ID
        in: path
        name: attachmentId
        required: true
        type: integer
      - default: 3600
        description: 过期时间（秒）
        in: query
        name: expires
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_gcc798_microservice-kit_internal_httpresponse.Response'
            - properties:
                data:
                  type: object
              type: object
      summary: 获取附件访问URL
      tags:
      - 附件管理
