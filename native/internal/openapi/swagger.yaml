      parameters:
      - description: Bearer {token}
        in: header
        name: Authorization
        required: true
        type: string
      - description: 业务类型
        in: query
        name: businessType
        required: true
        type: string
      - description: 业务ID
        in: query
        name: businessId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_gcc798_microservice-kit_internal_httpresponse.Response'
            - properties:
                data:
                  items:
                    type: object
                  type: array
              type: object
